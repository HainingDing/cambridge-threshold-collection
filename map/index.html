<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map · Cambridge Threshold Collection</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --fg:#111; --muted:#777; --bg:#fff; }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--fg);
    font:13px/1.4 "Helvetica Neue", Helvetica, Arial, sans-serif; }
  #map { position:absolute; inset:0; }
  .leaflet-tile-pane { filter:grayscale(1) contrast(.9) brightness(1.05); }
  .panel { position:absolute; top:12px; left:12px; z-index:500; background:var(--bg);
    border:1px solid var(--fg); padding:10px 12px; max-width:240px; }
  .panel h1 { font-size:13px; font-weight:600; margin:0 0 6px; letter-spacing:.02em; }
  .panel label { display:block; cursor:pointer; margin:2px 0; }
  .panel .n { color:var(--muted); font-variant-numeric:tabular-nums; }
  .pin { width:10px; height:10px; background:var(--fg); border:1px solid var(--bg); }
  .code { font-size:11px; font-weight:600; background:none; border:none; box-shadow:none; padding:0; }
  .code::before { display:none; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { border-radius:0; box-shadow:none; border:1px solid var(--fg); }
  .leaflet-popup-content { margin:10px 12px; }
  .leaflet-popup-content b { display:block; }
  .leaflet-popup-content a { color:var(--fg); }
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <h1>Cambridge Threshold Collection</h1>
  <div id="layers"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const LAYERS = {
  "college-chapel":  "College chapels",
  "cambridge-other": "Other religious buildings, Cambridge",
  "cambridgeshire":  "Cambridgeshire"
};
const map = L.map('map', { zoomControl:false }).setView([52.2053, 0.1218], 15);
L.control.zoom({ position:'topright' }).addTo(map);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

const groups = {};
Object.keys(LAYERS).forEach(k => groups[k] = L.layerGroup().addTo(map));

fetch('../places.geojson').then(r => r.json()).then(data => {
  const counts = {};
  data.features.forEach(f => {
    const p = f.properties, [lon, lat] = f.geometry.coordinates;
    const m = L.marker([lat, lon], { icon: L.divIcon({ className:'', html:'<div class="pin"></div>', iconSize:[10,10] }) });
    const link = p.cargo_url ? `<a href="${p.cargo_url}" target="_top">Open entry →</a>` : '';
    m.bindPopup(`<b>${p.code} · ${p.name}</b>${link}`);
    m.bindTooltip(p.code, { permanent:true, direction:'right', offset:[6,0], className:'code' });
    (groups[p.layer] || groups['college-chapel']).addLayer(m);
    counts[p.layer] = (counts[p.layer] || 0) + 1;
  });
  const box = document.getElementById('layers');
  Object.entries(LAYERS).forEach(([k, label]) => {
    if (!counts[k]) return;
    const id = 'layer-' + k;
    box.insertAdjacentHTML('beforeend',
      `<label><input type="checkbox" id="${id}" checked> ${label} <span class="n">${counts[k]}</span></label>`);
    document.getElementById(id).addEventListener('change', e =>
      e.target.checked ? groups[k].addTo(map) : map.removeLayer(groups[k]));
  });
});
</script>
</body>
</html>
